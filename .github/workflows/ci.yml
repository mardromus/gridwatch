name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint backend
        run: ruff check backend

      - name: Test backend
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up --build --detach --wait

      - name: Verify seeded app and localization
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health | grep '"seeded_poles":2160'
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"kind":"span"}' \
            http://127.0.0.1:8000/api/simulator/inject
          curl --fail --silent --show-error http://127.0.0.1:8000/api/dashboard | grep '"active_incidents":1'

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down --volumes