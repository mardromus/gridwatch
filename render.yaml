services:
  - type: web
    name: gridwatch
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CORS_ORIGINS
        value: "*"
      - key: GRIDWATCH_DB_PATH
        value: /tmp/gridwatch.db